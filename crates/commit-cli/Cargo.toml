[package]
name = "commit-cli"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "commit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
commit-core = { path = "../commit-core" }
commit-mcp = { path = "../commit-mcp" }
crossterm = "0.29.0"
tempfile = "3.23.0"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.23.0"
